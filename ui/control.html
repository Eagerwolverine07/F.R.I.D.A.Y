<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>F.R.I.D.A.Y Control Room</title>
<!-- F.R.I.D.A.Y Control Room: Atticus.swift's ControlRoom fills it with control.update(state) and control.mode(name). -->
<style>
:root{--bg:#0e0907;--panel:#170e0a;--track:#2a1910;--rule:#4a2a18;--edge:#8a4a22;--glow:#ff8a3d;--gold:#ffb454;--rose:#ff4f6d;--text:#fbe9d8;--soft:#c99a7c;--dim:#a87454}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"SF Mono",Menlo,ui-monospace,monospace;overflow:hidden;-webkit-user-select:none}
.wrap{height:100%;padding:24px 36px 26px;display:flex;flex-direction:column;gap:16px;position:relative}
.corner{position:absolute;width:54px;height:54px;border-color:var(--glow);border-style:solid;border-width:0}
.tl{left:18px;top:14px;border-left-width:2px;border-top-width:2px}.tr{right:18px;top:14px;border-right-width:2px;border-top-width:2px}
.bl{left:18px;bottom:14px;border-left-width:2px;border-bottom-width:2px}.br{right:18px;bottom:14px;border-right-width:2px;border-bottom-width:2px}
header{text-align:center}
h1{margin:0;font:500 34px/1.1 "Avenir Next Condensed","Helvetica Neue",sans-serif;letter-spacing:24px;margin-right:-24px;color:var(--gold)}
.sub{font-size:11px;letter-spacing:6px;color:var(--dim);margin-top:6px}
main{flex:1;min-height:0;display:grid;grid-template-columns:clamp(220px,23vw,320px) minmax(0,1fr) clamp(250px,27vw,390px);gap:24px}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
section{border:1px solid var(--edge);border-radius:6px;padding:14px 16px;background:var(--panel);min-height:0}
h2{margin:0 0 10px;font-size:12px;font-weight:400;letter-spacing:4px;color:var(--gold);border-bottom:1px solid var(--rule);padding-bottom:7px;display:flex;justify-content:space-between}
h2 small{font-size:11px;letter-spacing:2px;color:var(--rose)}
.meters{display:grid;grid-template-columns:42px 1fr 40px;gap:9px;align-items:center;font-size:11px;color:var(--soft)}
.bar{height:7px;background:var(--track);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--rose);border-radius:4px;transition:width .6s}
.bar.cool i{background:var(--gold)} .num{text-align:right;color:var(--text)}
.clock{font-size:34px;color:var(--gold);letter-spacing:3px;margin-top:12px}.date{font-size:11px;letter-spacing:3px;color:var(--dim)}
.big{font-size:32px}.muted{color:var(--dim);font-size:11px;letter-spacing:2px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.song{font:600 17px "Avenir Next","Helvetica Neue",sans-serif;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:0;min-height:0}

#mode{font-size:16px;letter-spacing:10px;margin-right:-10px;color:var(--gold)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.reactor{position:relative;width:min(100%,62vh);aspect-ratio:1}
.layer{position:absolute;inset:0;width:100%;height:100%;will-change:transform}   /* each spinning part is its own GPU layer: turned, never redrawn */
.r1{animation:spin 40s linear infinite}.r2{animation:spin 24s linear infinite reverse}.r3{animation:spin 12s linear infinite}.r2b{animation:spin 8s linear infinite reverse}
.core{animation:pulse 2.4s ease-in-out infinite}.lvl{animation:pulse 3s ease-in-out infinite}
body.busy .r3{animation-duration:3s}body.busy .r2b{animation-duration:2s}
body.hear .lvl,body.talk .lvl{animation-duration:.5s}body.talk .core{animation-duration:.8s}
body.paused .layer{animation-play-state:paused}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--edge) transparent;padding-right:4px}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:var(--edge);border-radius:3px}
.talk-log{display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.5}
.talk-log p{margin:0}.you{color:var(--soft)}.fri{color:var(--text)}
#agents{display:flex;flex-direction:column;gap:10px;font-size:12px}
.empty{color:var(--dim);font-size:12px}
form{display:flex;align-items:center;gap:12px;border:1px solid var(--glow);border-radius:8px;padding:0 18px;height:52px;background:var(--panel)}
form span{color:var(--gold);font-size:19px}
input{flex:1;background:transparent;border:0;outline:none;color:var(--text);font:15px "SF Mono",Menlo,monospace;letter-spacing:1px}
input::placeholder{color:var(--dim)}
@media (prefers-reduced-motion:reduce){.layer{animation:none}}
</style></head>

<div id="mode">STANDING BY</div><div class="muted" id="hint">SAY “FRIDAY” OR USE YOUR SHORTCUT</div>
</div>
<div class="col">
<section style="flex:1.2;display:flex;flex-direction:column"><h2>TRANSCRIPT</h2><div class="scroll" id="talkBox"><div class="talk-log" id="talk"><p class="empty">Nothing yet today.</p></div><div class="talk-log" id="live" style="margin-top:10px"></div></div></section>
<section style="flex:1"><h2>AGENTS <small id="running"></small></h2><div id="agents"><p class="empty">No agents running.</p></div></section>
</div>
</main>
<form id="ask"><span aria-hidden="true">›</span><input id="text" aria-label="Ask F.R.I.D.A.Y" placeholder="Type to ask, or just say “Friday”…   (Enter to send · Esc to close)" autocomplete="off"></form>
</div>
<script>
const $ = id => document.getElementById(id)
const post = m => window.webkit?.messageHandlers?.control?.postMessage(m)
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const mmss = ms => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') }
function tick() {
  const d = new Date()
  $('clock').textContent = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false})
  $('date').textContent = d.toLocaleDateString([], {weekday:'short', day:'2-digit', month:'short', year:'numeric'}).toUpperCase().replace(/,/g, '')
}
setInterval(tick, 1000); tick()
// The transcript follows the newest line, unless you have scrolled up to read something older.
const atBottom = () => { const b = $('talkBox'); return b.scrollHeight - b.scrollTop - b.clientHeight < 48 }
const stick = was => { if (was) $('talkBox').scrollTop = $('talkBox').scrollHeight }
function meter(id, v) { if (v == null) return; $(id).style.width = v + '%'; $(id + 'N').textContent = v + '%' }
window.control = {
  update(s) {
    const sys = s.system || {}; meter('cpu', sys.cpu); meter('mem', sys.memory)
    if (sys.battery != null) { $('bat').style.width = sys.battery + '%'; $('batN').textContent = sys.battery + '%' }
    const w = s.weather
    if (w && w.temp != null) {
      $('temp').textContent = w.temp + '°' + w.unit; $('sky').textContent = w.sky || ''; $('place').textContent = (w.place || '').toUpperCase()
      $('days').innerHTML = (w.days || []).map(d => `<span>${esc(d.day)} ${esc(d.high)}°</span>`).join('')
    } else if (w === null) $('sky').textContent = 'OFFLINE'
    const m = s.music || {}
    if (m.title) {
      $('song').textContent = m.title; $('artist').textContent = (m.artist || '').toUpperCase() + (m.playing ? ' · SPOTIFY' : ' · PAUSED')
      $('prog').style.width = (m.length ? Math.min(100, m.at / m.length * 100) : 0) + '%'; $('at').textContent = mmss(m.at); $('len').textContent = mmss(m.length)
    } else {
      $('song').textContent = 'Nothing playing'; $('artist').textContent = m.connected === false ? 'SPOTIFY NOT CONNECTED' : 'SAY “PLAY SOME MUSIC”'
      $('prog').style.width = '0'; $('at').textContent = $('len').textContent = ''
    }
    const wasBottom = atBottom()
    const t = s.transcript || []
    if (live.heard && t.length && t[t.length - 1].you.trim() === live.heard.trim() && !live.streaming) control.live('reset', '')   // the finished turn is in the log now
    $('talk').innerHTML = t.length ? t.map(r => `<p class="you">YOU › ${esc(r.you)}</p><p class="fri">» ${esc(r.friday)}</p>`).join('') : '<p class="empty">Nothing yet today.</p>'
    stick(wasBottom)
    const a = s.agents || [], timers = s.timers || [], active = a.filter(r => r.status !== 'done').length + timers.length
    $('running').textContent = active ? active + ' RUNNING' : ''
    const rows = a.map(r => `<div class="row"><span>${esc(r.title.toUpperCase())}</span><span style="color:var(${r.status === 'done' ? '--dim' : r.status === 'needs-you' ? '--rose' : '--gold'})">${esc(r.status === 'needs-you' ? 'NEEDS YOU' : r.status === 'done' ? 'DONE' : (r.step || r.status).toUpperCase().slice(0, 28))}</span></div>`)
      .concat(timers.map(r => `<div class="row"><span>TIMER · ${esc(r.label.toUpperCase())}</span><span style="color:var(--gold)">${mmss(r.left * 1000)} LEFT</span></div>`))
      .concat(s.briefing ? [`<div class="row" style="color:var(--dim)"><span>DAILY BRIEFING</span><span>${esc(s.briefing)}</span></div>`] : [])
    $('agents').innerHTML = rows.length ? rows.join('') : '<p class="empty">No agents running.</p>'
  },
  live(kind, text) {   // the conversation as it happens: what you said, then her answer as it streams
    if (kind === 'reset') { live.heard = live.answer = ''; live.streaming = false }
    if (kind === 'heard') { live.heard = text; live.answer = ''; live.streaming = false }
    if (kind === 'answer') { live.answer = text; live.streaming = true; clearTimeout(live.done); live.done = setTimeout(() => { live.streaming = false }, 4000) }
    const wasBottom = atBottom()
    $('live').innerHTML = (live.heard ? `<p class="you">YOU › ${esc(live.heard)}</p>` : '') + (live.answer ? `<p class="fri">» ${esc(live.answer)}</p>` : '')
    stick(wasBottom)
  },
  pause(on) {   // the window is hidden, minimized or covered: stop every animation; back on, pick up where it was
    document.body.classList.toggle('paused', on)
    if (!on && wave.target) startWave()
  },
  mode(name) {   // standby, hear, busy, talk
    document.body.classList.remove('standby', 'hear', 'busy', 'talk'); document.body.classList.add(name)
    wave.target = name === 'talk' ? 20 : 0
    if (wave.target) startWave()
    $('mode').textContent = {hear:'LISTENING', busy:'THINKING', talk:'SPEAKING'}[name] || 'STANDING BY'
  },
}
// While F.R.I.D.A.Y speaks, bars of light flicker outward from the outer ring like a round audio meter; silent, they fold away.
const wave = { amp: 0, target: 0, still: true, running: false, last: 0, reduced: matchMedia('(prefers-reduced-motion: reduce)').matches }
const live = { heard: '', answer: '', streaming: false, done: 0 }
const specBars = [...document.querySelectorAll('#spec line')].map((el, i) => {
  const a = i / 96 * Math.PI * 2 - Math.PI / 2
  return { el, c: Math.cos(a), s: Math.sin(a), seed: (i * 7919) % 97 / 97 }
})
function drawWave(now) {
  if (now - wave.last < 33 && !wave.still) { requestAnimationFrame(drawWave); return }   // about 30 frames a second
  wave.last = now
  const t = now / 1000
  wave.amp += (wave.target - wave.amp) * 0.12
  const quiet = wave.target === 0 && wave.amp < 0.05
  const swell = 0.5 + 0.5 * Math.abs(Math.sin(t * 2.3) * Math.sin(t * 1.1 + 1))   // the rise and fall of a sentence
  for (const b of specBars) {
    const jitter = Math.abs(Math.sin(t * (5 + b.seed * 6) + b.seed * 40))   // each bar flickers at its own pace
    const len = quiet ? 0 : wave.amp * swell * (0.25 + 0.75 * jitter)
    b.el.setAttribute('x2', (260 + (236 + len) * b.c).toFixed(1)); b.el.setAttribute('y2', (260 + (236 + len) * b.s).toFixed(1))
  }
  wave.still = quiet
  if (wave.still || document.body.classList.contains('paused')) { wave.running = false; return }   // folded away or hidden: no frames at all
  requestAnimationFrame(drawWave)
}
function startWave() { if (!wave.running && !wave.reduced) { wave.running = true; wave.still = false; requestAnimationFrame(drawWave) } }
$('ask').addEventListener('submit', e => { e.preventDefault(); const t = $('text').value.trim(); if (t) { post({send:t}); $('text').value = '' } })
document.addEventListener('keydown', e => { if (e.key === 'Escape') post({close:true}) })
post({ready:true})
</script>
